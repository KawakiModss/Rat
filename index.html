<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nex Code</title>
<style>
:root{--ed:#0a0f1c;--bar:#111a2e;--bar2:#0d1526;--ac:#2aa5ff;--on:#fff;--tx:#d7e3ff;--mu:#6b7a99;--ln:#1d2a45;--k:#c792ea;--s:#a5e075;--c:#5c6b8a;--n:#f78c6c;--t:#82aaff;--a:#ffcb6b;--fs:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ed);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;height:54px;padding:0 4px;background:var(--bar);flex:none}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib:active{background:var(--ln)}.ib.off{opacity:.3}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0;padding:0 6px}.ttl b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{font-size:11px;color:var(--mu)}
.tabs{display:flex;background:var(--bar2);flex:none;overflow-x:auto;scrollbar-width:none;min-height:40px}.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:40px;padding:0 4px 0 12px;font-size:13px;color:var(--mu);white-space:nowrap;border-bottom:2px solid transparent;flex:none;cursor:pointer}
.tab.on{color:var(--tx);background:var(--ed);border-bottom-color:var(--ac)}
.tab i{font-style:normal;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:16px}.tab i:active{background:var(--ln)}
.plus{position:sticky;right:0;margin-left:auto;width:44px;height:40px;background:var(--bar2);font-size:24px;color:var(--ac);flex:none}
.ico{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:5px;font:700 10px/1 system-ui;flex:none}
.ed{position:relative;flex:1;min-height:0;display:flex;background:var(--ed)}
.bgl{position:absolute;inset:0;pointer-events:none;display:none}
#bgi{background-size:cover;background-position:center}#bgd{background:var(--ed)}
#code{position:relative;flex:1;display:flex;min-width:0}
.gut{flex:none;width:46px;overflow:hidden;text-align:right;padding:10px 8px 10px 0;color:var(--mu);border-right:1px solid var(--ln);font:var(--fs)/1.5 ui-monospace,Menlo,Consolas,monospace;user-select:none;white-space:pre}
.box{position:relative;flex:1;min-width:0}
.box pre,.box textarea{position:absolute;inset:0;margin:0;padding:10px 12px 70px;border:0;outline:0;font:var(--fs)/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2;overflow:auto;overflow-wrap:break-word}
.box pre{overflow:hidden;pointer-events:none}
.box textarea{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ac);resize:none}
.box textarea::selection{background:rgba(127,127,127,.4)}
.k{color:var(--k)}.s{color:var(--s)}.c{color:var(--c);font-style:italic}.n{color:var(--n)}.t{color:var(--t)}.a{color:var(--a)}
.mdv{position:absolute;inset:0;overflow:auto;display:none;background:var(--ed);padding:18px 18px 80px;line-height:1.65;font-size:15px}
.hasimg .mdv{background:transparent}
.mdv h1{font-size:26px;margin:.4em 0 .3em}.mdv h2{font-size:18px;margin:1.3em 0 .4em;color:var(--ac)}
.mdv .lgo{display:block;margin:6px auto 0;width:150px;height:150px;border-radius:30px}
.mdv blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--ac);background:var(--bar2);color:var(--mu)}
.mdv code{background:var(--bar);padding:2px 6px;border-radius:4px;font-size:13px}.mdv li{margin:3px 0}.mdv pre{background:var(--bar);padding:12px;border-radius:6px;overflow:auto}
.imgv{display:grid;place-items:center;gap:10px;color:var(--mu);font-size:12px}.imgv img{max-width:100%;max-height:70vh}
.keys{display:flex;background:var(--bar);flex:none;overflow-x:auto;scrollbar-width:none;min-height:42px;padding-bottom:env(safe-area-inset-bottom)}.keys::-webkit-scrollbar{display:none}
.keys button{flex:none;min-width:44px;height:42px;padding:0 12px;font:15px ui-monospace,Menlo,Consolas,monospace}.keys button:active{background:var(--ac);color:var(--on)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.scrim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(84%,310px);background:var(--bar);transform:translateX(-102%);transition:transform .2s;z-index:11;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.dr.on{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--ln)}.dh img{width:38px;height:38px;border-radius:10px}.dh b{display:block}.dh small{color:var(--mu);font-size:12px}
.fl{flex:1;overflow:auto}
.f{display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;font-size:14px;cursor:pointer}.f.on{background:var(--ed);color:var(--ac)}
.f span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.f em{font-style:normal;width:34px;height:34px;display:grid;place-items:center;color:var(--mu);border-radius:50%;font-size:18px}
.da{display:flex;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}.da button{flex:1;height:52px;font-size:13px;color:var(--ac)}.da button+button{border-left:1px solid var(--ln)}
.menu{position:fixed;right:8px;top:calc(54px + env(safe-area-inset-top));background:var(--bar);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:12;display:none;min-width:200px;overflow:hidden}.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px}.menu button:active{background:var(--ln)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.mod.on{display:flex}
.mb{background:var(--bar);border-radius:8px;padding:18px;width:100%;max-width:380px}.mb h3{margin:0 0 12px;font-size:16px;font-weight:500}
.mb input[type=text]{width:100%;background:var(--ed);border:1px solid var(--ln);border-radius:6px;padding:11px;font-size:15px;outline:0}.mb input[type=text]:focus{border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:6px 11px;border:1px solid var(--ln);border-radius:16px;font-size:12px}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.bt{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.bt button{padding:10px 16px;border-radius:6px;font-size:14px}.bt .pri{background:var(--ac);color:var(--on)}
.full{position:fixed;inset:0;background:var(--ed);z-index:30;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}.full.on{display:flex}
.stb{flex:1;overflow:auto;padding:0 16px 40px}.sec{margin:20px 0 8px;font-size:12px;color:var(--ac);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:14px}.row.col{flex-direction:column;align-items:stretch}
.row input[type=text]{background:var(--bar);border:1px solid var(--ln);border-radius:6px;padding:10px;outline:0;width:100%}
.row input[type=color]{width:44px;height:30px;border:0;padding:0;background:none}.row input[type=range]{width:50%}
#fr{flex:1;border:0;background:#fff;min-height:0;width:100%}
.rm{flex:1;min-height:0;display:none;flex-direction:column}.rm pre{flex:1;margin:0;overflow:auto;padding:14px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.rm .in{display:flex;gap:8px;padding:8px;background:var(--bar)}.rm textarea{flex:1;height:48px;background:var(--ed);border:1px solid var(--ln);border-radius:6px;color:var(--tx);padding:8px;font:13px monospace;resize:none}
.rm .in button{background:var(--ac);color:var(--on);border-radius:6px;padding:0 14px;font-size:13px}
.con{height:34%;display:none;border-top:2px solid var(--ac);background:var(--ed)}.con.on{display:block}
.lg{height:100%;overflow:auto;padding:8px 12px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}.lg div{border-bottom:1px solid var(--ln);padding:2px 0;white-space:pre-wrap;word-break:break-word}.lg .e{color:#f2777a}.lg .w{color:var(--a)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--ed);padding:8px 16px;border-radius:18px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
#spl{position:fixed;inset:0;z-index:90;background:#010307;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;transition:opacity .4s;animation:splx .01s 3.2s forwards}
#spl.out{opacity:0;pointer-events:none}
#spl img{width:min(48vw,210px);height:auto;border-radius:22%;animation:splin .5s ease-out}
#spl .bar{width:min(48vw,210px);height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#spl .bar i{display:block;height:100%;background:#2aa5ff;transform-origin:left;animation:splb 1.1s ease-in-out forwards}
@keyframes splin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes splb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes splx{to{opacity:0;visibility:hidden;pointer-events:none}}
.pick{display:flex;gap:8px;margin:12px 0 8px}.pick button{flex:1;padding:11px 6px;border:1px solid var(--ac);color:var(--ac);border-radius:6px;font-size:13px}.pick button:active{background:var(--ac);color:var(--on)}
.dh small{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln)}
.pb button{flex:1;height:38px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ac);border-radius:8px;color:var(--ac);font-size:13px}
.pb button.fill{background:var(--ac);color:var(--on)}.pb button:active{opacity:.7}
.pb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f.d{gap:8px;font-weight:500}
.f em:active{background:var(--ln)}
.fic{width:24px;height:24px;flex:none}
.chv{font-style:normal;width:14px;flex:none;display:inline-block;text-align:center;color:var(--mu);font-size:18px;line-height:1;transition:transform .15s}.chv.o{transform:rotate(90deg)}
.mb label{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px}
.mb select{width:100%;background:var(--ed);border:1px solid var(--ln);border-radius:6px;padding:11px;font-size:14px;outline:0}
.pick button{display:flex;align-items:center;justify-content:center;gap:8px}
.pick+.pick{margin-top:0}
.bigb{background:var(--ac);color:var(--on);border-radius:8px;padding:12px;font-size:14px;margin-top:10px}.bigb:active{opacity:.8}
.pc{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;background:var(--bar);border:1px solid var(--ln);border-radius:10px;cursor:pointer}.pc.on{border-color:var(--ac)}
.pc div{flex:1;min-width:0}.pc b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc small{color:var(--mu);font-size:12px}
.pc em{font-style:normal;width:34px;height:34px;display:grid;place-items:center;color:var(--mu);font-size:18px;border-radius:50%;flex:none}.pc em:active{background:var(--ln)}
.toast{max-width:90%;text-align:center}
</style></head>

function readZip(buf){var dv=new DataView(buf),n=buf.byteLength,e=-1,i;
 for(i=n-22;i>=Math.max(0,n-65557);i--){if(dv.getUint32(i,true)==0x06054b50){e=i;break}}
 if(e<0)throw new Error("bukan file zip yang valid");
 var cnt=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true),out=[];
 if(cnt==0xFFFF||p==0xFFFFFFFF)throw new Error("zip64 belum didukung");
 for(i=0;i<cnt;i++){
  if(p+46>n||dv.getUint32(p,true)!=0x02014b50)throw new Error("struktur zip rusak");
  var nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
  out.push({name:new TextDecoder("utf-8").decode(new Uint8Array(buf,p+46,nl)),flag:dv.getUint16(p+8,true),method:dv.getUint16(p+10,true),csize:dv.getUint32(p+20,true),usize:dv.getUint32(p+24,true),lho:dv.getUint32(p+42,true)});
  p+=46+nl+el+cl}

async function zipData(buf,en){

 if(dv.getUint32(lo,true)!=0x04034b50)throw new Error("header lokal rusak");

 if(en.method==0)return raw;

 if(typeof DecompressionStream=="undefined")throw new Error("WebView ini belum mendukung unzip");
 var ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();
 w.write(raw.slice()).catch(function(){});w.close().catch(function(){});
 return new Uint8Array(await new Response(ds.readable).arrayBuffer())}

  var buf=await file.arrayBuffer(),ents=readZip(buf),keep=[],dirs=[],tot=0,skipped=0,files={};

   var nm=en.name.replace(/\\/g,"/").replace(/^(\.\/|\/)+/,""),isd=/\/$/.test(nm),seg=nm.split("/").filter(function(s){return s!=""&&s!="."});

   var t=keep[0].seg[0];keep.forEach(function(k){k.seg=k.seg.slice(1)});

addEventListener("message",function(e){var d=e.data;if(e.source!==$("fr").contentWindow||!d||!d.__c)return;var l=document.createElement("div");l.className=d.t=="error"?"e":d.t=="warn"?"w":"";l.textContent="\u203a "+d.m;$("lg").appendChild(l);$("lg").scrollTop=1e9;if(d.t=="error")$("con").classList.add("on")});

function setOpen(){$("st").classList.add("on");stUI()}
function stUI(){var s=ST;$("stb").innerHTML=`
<div class="sec">Tema</div><div class="chips">${Object.keys(T).map(function(k){return `<button class="chip${s.theme==k?" on":""}" onclick="setT('${k}')">${TN[k]}</button>`}).join("")}</div>
<div class="row"><span>Warna latar kode</span><span><input type="color" value="${s.edbg||T[s.theme][0]}" oninput="setBg(this.value)"> <button class="chip" onclick="setBg('')">Reset</button></span></div>
<div class="row"><span>Gambar latar kode</span><span><button class="chip" onclick="$('bgf').click()">Pilih dari galeri</button> <button class="chip" onclick="setImg('')">Hapus</button></span></div>
${s.bgimg?`<div class="row"><span>Gelapkan gambar: <b id="dimv">${Math.round(s.dim*100)}</b>%</span><input type="range" min="0" max="95" value="${Math.round(s.dim*100)}" oninput="setDim(this.value)"></div>`:""}
<div class="row"><span>Ukuran font: <b id="fsv">${s.fs}</b>px</span><input type="range" min="10" max="22" value="${s.fs}" oninput="setFs(this.value)"></div>
<div class="row"><span>Word wrap</span><input type="checkbox" ${s.wrap?"checked":""} onchange="setW(this.checked)"></div>
<div class="sec">Proyek</div>
<div class="row" onclick="resetAll()"><span style="color:#f2777a">Reset proyek ke contoh awal</span></div>`}
function setT(k){ST.theme=k;ST.edbg="";save();theme();stUI()}
function setBg(v){ST.edbg=v;save();theme();if(!v)stUI()}
function setImg(v){ST.bgimg=v;save();theme();stUI()}
function setDim(v){ST.dim=v/100;save();theme();$("dimv").textContent=v}
function setFs(v){ST.fs=+v;save();theme();$("fsv").textContent=v}
function setW(c){ST.wrap=c?1:0;save();theme();paint()}
function resetAll(){if(confirm("Reset proyek ini ke contoh awal? Semua file di proyek ini terhapus.")){var p=newProj(S.name);p.id=S.id;Object.keys(S).forEach(function(k){delete S[k]});Object.assign(S,p);save();$("st").classList.remove("on");render()}}

$("dlogo").innerHTML=LOGO;theme();render();
setTimeout(function(){var p=$("spl");if(!p)return;p.classList.add("out");setTimeout(function(){p.remove()},450)},1200);
</script>
